<script>
/* Live, from scripts/supervise.py on this machine: the games every 2 s, the trainers every 5 s, the curves every
   20 s (and only when a run changed). Nothing polls while the tab is hidden, so the game monitors -- which run
   only while someone looks -- stop on their own. */
const live = { games: null, selected: null, workspace: null, fps: null, busy: false, lost: false, cards: new Map(),
               barKey: "", trainers: new Map(), runsKey: "" };

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", body: JSON.stringify(body),
    headers: { "Content-Type": "application/json", "X-Supervise": "1" },  // no other page can send this
  };
  const response = await fetch(path, opts);
  if (!response.ok) throw new Error(`${path}: ${response.status}`);
  return response.json();
}

/* A command's answer, refused or not: the server says why in {error}. Only no answer at all is a lost server. */
async function command(path, body) {
  try {
    const response = await fetch(path, { method: "POST", body: JSON.stringify(body),
      headers: { "Content-Type": "application/json", "X-Supervise": "1" } });
    return await response.json();
  } catch (e) {
    connection(false);
    return { error: "the dashboard server is not answering" };
  }
}

function connection(ok) {
  live.lost = !ok;
  const node = document.getElementById("conn");
  if (node) {
    node.className = "conn" + (ok ? "" : " lost");
    node.textContent = ok ? "live" : "server not answering";
  }
}

/* -- games ----------------------------------------------------------------- */
function gameState(s) {
  if (!s.monitor) return ["info", "-", "checking"];
  if (!s.game) return ["serious", "!!", "no game window"];
  if (s.fps == null) return ["info", "-", "measuring"];
  if (!s.fps) return ["warning", "!", "no frames"];
  return ["good", "OK", "running"];
}

const stackText = (s) => s.stack === "gpu" ? "GPU frames (glamor)" : "CPU copy (-shm), ~11 fps at most";

async function showViewers(displays, focus = false) {
  live.busy = true;
  renderBar(true);
  try {
    await api("/api/viewers", { displays, workspace: live.workspace, fps: live.fps, focus });
  } catch (e) { connection(false); }
  live.busy = false;
  await pollGames();
}

const anyWatched = () => live.games.screens.some((s) => s.watched);

function renderBar(force = false) {
  const g = live.games;
  const open = anyWatched();
  const key = [open, live.busy, live.workspace, live.fps, g.thumbs, live.lost].join("|");
  if (key === live.barKey && !force) return;
  live.barKey = key;
  const chosen = () => g.screens.filter((s) => live.selected.has(s.number)).map((s) => s.number);
  const workspace = el("select", { "aria-label": "Workspace for the viewer windows", onchange: (e) => {
    live.workspace = e.target.value;
    if (anyWatched()) showViewers(chosen()); else renderBar(true);
  } }, Array.from({ length: 10 }, (_, i) => {
    const o = el("option", { value: String(i + 1), text: String(i + 1) });
    if (String(i + 1) === live.workspace) o.selected = true;
    return o;
  }));
  const fpsChip = (v) => el("button", { class: "chip seg", "aria-pressed": String(live.fps === v), onclick: () => {
    live.fps = v;
    if (anyWatched()) showViewers(chosen()); else renderBar(true);
  } }, [document.createTextNode(`${v} fps`)]);
  mount(document.getElementById("viewer-bar"), [
    el("span", { class: "caption", text: "Viewer windows" }),
    el("button", {
      class: "chip primary", "aria-pressed": String(open), disabled: live.busy ? "" : null,
      title: open ? "Close every viewer window" : "Open a viewer for each game marked Watch",
      onclick: () => showViewers(open ? [] : chosen()),
    }, [el("span", { class: "key" }), document.createTextNode(live.busy ? "Working..." : open ? "Shown" : "Hidden")]),
    el("span", { class: "caption", text: "on workspace" }),
    workspace,
    fpsChip(15), fpsChip(30), fpsChip(60),
    el("button", { class: "chip", onclick: () => api("/api/goto", { workspace: live.workspace }).catch(() => connection(false)) },
      [document.createTextNode(`Go to workspace ${live.workspace}`)]),
    el("span", { class: "spacer" }),
    el("button", { class: "chip", "aria-pressed": String(g.thumbs), onclick: async () => {
      await api("/api/thumbs", { on: !g.thumbs }).catch(() => connection(false));
      await pollGames();
    } }, [el("span", { class: "key" }), document.createTextNode("Thumbnails")]),
    el("span", { id: "conn", class: "conn" + (live.lost ? " lost" : ""), text: live.lost ? "server not answering" : "live" }),
  ]);
}

function gameCard(s) {
  const img = el("img", { class: "thumb", alt: `Latest whole frame on display ${s.display}`, width: 320, height: 180 });
  const off = el("div", { class: "thumb off", text: "Thumbnails off" });
  const state = el("span", { class: "state" });
  const watch = el("button", { class: "chip", title: "Include this game when the viewer windows are shown",
    onclick: () => {
      if (live.selected.has(s.number)) live.selected.delete(s.number); else live.selected.add(s.number);
      const chosen = live.games.screens.filter((x) => live.selected.has(x.number)).map((x) => x.number);
      if (anyWatched()) showViewers(chosen); else renderGames();
    } }, [el("span", { class: "key" }), document.createTextNode("Watch")]);
  const fps = el("span", { class: "value" });
  const detail = el("div", { class: "detail" });
  const node = el("article", { class: "card game" }, [
    img, off,
    el("div", { class: "game-head" }, [el("span", { class: "name", text: s.display }), state, watch]),
    el("div", { class: "game-stats" }, [fps, el("span", { class: "label", text: "whole frames a second" }), detail]),
  ]);
  return { node, img, off, state, watch, fps, detail, thumbAt: null };
}

function renderGames() {
  const g = live.games;
  renderBar();
  const grid = document.getElementById("games");
  if (!g.screens.length) {
    live.cards.clear();
    mount(grid, [el("p", { class: "empty-note", text: "No game instance is running (no rootful Xwayland found). " +
      "Start the fleet with scripts/instances.py up and they appear here." })]);
    return;
  }
  const numbers = g.screens.map((s) => s.number).join(",");
  if ([...live.cards.keys()].join(",") !== numbers) {
    live.cards = new Map(g.screens.map((s) => [s.number, gameCard(s)]));
    mount(grid, [...live.cards.values()].map((c) => c.node));
  }
  for (const s of g.screens) {
    const c = live.cards.get(s.number);
    const [level, icon, word] = gameState(s);
    c.state.className = `state ${level}`;
    mount(c.state, [el("span", { class: "icon", text: icon }), document.createTextNode(word)]);
    c.watch.setAttribute("aria-pressed", String(live.selected.has(s.number)));
    c.fps.textContent = s.fps == null ? "--" : fmtValue(s.fps);
    c.detail.textContent = [`${s.width}×${s.height}`, stackText(s), s.game || "no game window",
      s.watched ? "in a viewer window" : null].filter(Boolean).join(" · ");
    c.img.hidden = !g.thumbs;
    c.off.hidden = g.thumbs;
    if (g.thumbs && s.thumb_at && s.thumb_at !== c.thumbAt) {
      c.thumbAt = s.thumb_at;
      c.img.src = `/thumb/${s.number}.png?t=${s.thumb_at}`;
    }
  }
}

async function pollGames() {
  try {
    live.games = await api("/api/games");
    connection(true);
  } catch (e) {
    connection(false);
    return;
  }
  const g = live.games;
  if (live.workspace === null) { live.workspace = g.viewer.workspace; live.fps = g.viewer.fps; }
  if (live.selected === null) {
    const watched = g.screens.filter((s) => s.watched).map((s) => s.number);
    live.selected = new Set(watched.length ? watched : g.screens.map((s) => s.number));
  }
  for (const s of g.screens) if (!live.seen?.has(s.number) && !anyWatched()) live.selected.add(s.number);
  live.seen = new Set(g.screens.map((s) => s.number));
  renderGames();
}

/* -- trainers -------------------------------------------------------------- */
function trainerCard(t) {
  const run = el("span", { class: "run" });
  const facts = el("span", { class: "facts" });
  const log = el("pre", { class: "log", tabindex: "0" });
  const stop = el("button", { class: "chip", onclick: async () => {
    const name = t.run || `pid ${t.pid}`;
    if (!confirm(`Stop ${name}?\n\nLike Ctrl-C: it stops its actors (every key released) and writes its checkpoint.`)) return;
    stop.disabled = true;
    const answer = await command("/api/stop", { pid: t.pid });
    if (answer.error) alert(answer.error);
    await pollTrainers();
  } });
  const force = el("button", { class: "chip danger", hidden: "", onclick: async () => {
    if (!confirm("Force stop?\n\nIt kills the trainer and its actors now: no checkpoint beyond the last periodic one, " +
                 "and a key an actor held stays held until the next run.")) return;
    const answer = await command("/api/stop", { pid: t.pid, force: true });
    if (answer.error) alert(answer.error);
    await pollTrainers();
  } }, [document.createTextNode("Force stop")]);
  const node = el("article", { class: "card trainer" }, [
    el("div", { class: "top" }, [run, facts, el("div", { class: "actions" }, [stop, force])]), log]);
  return { node, run, facts, log, stop, force };
}

async function pollTrainers() {
  let trainers;
  try {
    trainers = (await api("/api/live")).trainers;
  } catch (e) { connection(false); return; }
  const holder = document.getElementById("trainers");
  if (!trainers.length) {
    live.trainers.clear();
    mount(holder, [el("p", { class: "empty-note", text: "No trainer is running. A scripts/train_*.py started from " +
      "any checkout or worktree shows up here with its output." })]);
    return;
  }
  const pids = trainers.map((t) => t.pid).join(",");
  if ([...live.trainers.keys()].join(",") !== pids) {
    live.trainers = new Map(trainers.map((t) => [t.pid, trainerCard(t)]));
    mount(holder, [...live.trainers.values()].map((c) => c.node));
  }
  for (const t of trainers) {
    const c = live.trainers.get(t.pid);
    c.run.textContent = t.run || "a run not under any runs/ yet";
    mount(c.facts, [
      document.createTextNode(`pid ${t.pid} · running ${fmtDuration(t.elapsed_s)} · ${t.tree} · `),
      el("code", { text: `${t.script} ${t.args}` }),
    ]);
    const stopping = t.stopping_s != null;
    c.stop.disabled = stopping;
    c.stop.textContent = stopping ? `Stopping… ${fmtDuration(t.stopping_s)}` : "Stop";
    c.stop.title = stopping ? "Asked to stop: it is releasing its actors and writing its checkpoint" : "Stop gracefully, as Ctrl-C would";
    c.force.hidden = !t.can_force;
    const atBottom = c.log.scrollTop + c.log.clientHeight >= c.log.scrollHeight - 4;
    const text = t.tail.length ? t.tail.join("\n") : (t.log ? "(nothing printed yet)" : "(its output is not going to a file)");
    if (c.log.textContent !== text) {
      c.log.textContent = text;
      if (atBottom) c.log.scrollTop = c.log.scrollHeight;  // follow the log, unless the reader scrolled up
    }
  }
}

/* -- starting a run ---------------------------------------------------------
   Built once; polling only refreshes the choices and the readiness line, never what the reader has typed. */
const launch = { options: null, built: null, busy: false };

const launchTree = () => launch.options.trees.find((t) => t.label === launch.built.tree.value);

function readiness() {
  const t = launchTree();
  const f = launch.built;
  if (!t) return ["serious", "!!", "No checkout here can start a run.", false];
  const actors = parseInt(f.actors.value, 10);
  if (!(actors >= 1 && actors <= 16)) return ["warning", "!", "Between 1 and 16 games.", false];
  if (!f.name.value.trim()) return ["warning", "!", "The run needs a name.", false];
  if (/(^|\s)--env[ =]sim(\s|$)/.test(f.extra.value)) return ["good", "OK", "A NachtSim run: no games needed.", true];
  if (!t.fleet) return ["serious", "!!", `${t.label} has no fleet yet: scripts/instances.py up --n ${actors}`, false];
  if (t.busy.length) return ["warning", "!", `${t.busy[0]} is already playing this fleet. Stop it first.`, false];
  if (t.fleet.running < actors) {
    return ["serious", "!!", `${t.fleet.running} of the fleet's ${t.fleet.n} games are running and this run needs ${actors}: ` +
      `scripts/instances.py up --n ${Math.max(actors, t.fleet.n)}`, false];
  }
  return ["good", "OK", `${t.fleet.running} of ${t.fleet.n} games running. Ready.`, true];
}

function updateReadiness() {
  const f = launch.built;
  const [level, icon, text, ok] = readiness();
  f.state.className = `state ${level}`;
  mount(f.state, [el("span", { class: "icon", text: icon }), document.createTextNode(text)]);
  f.start.disabled = !ok || launch.busy;
}

function buildLauncher() {
  const f = {};
  const field = (label, input, wide) =>
    el("label", { class: "field" + (wide ? " wide" : "") }, [el("span", { text: label }), input]);
  f.tree = el("select", { onchange: () => { f.name.dataset.touched = ""; fillLauncher(true); } });
  f.init = el("select");
  f.actors = el("input", { type: "number", min: "1", max: "16", oninput: updateReadiness });
  f.name = el("input", { type: "text", spellcheck: "false", oninput: () => { f.name.dataset.touched = "1"; updateReadiness(); } });
  f.extra = el("input", { type: "text", spellcheck: "false", placeholder: "e.g. --total-steps 500000 --lr 3e-5",
                          oninput: updateReadiness });
  f.state = el("span", { class: "state" });
  f.start = el("button", { class: "chip primary", onclick: startRun },
               [el("span", { class: "key" }), document.createTextNode("Start run")]);
  f.msg = el("div", { class: "launch-msg", role: "status" });
  f.tail = el("pre", { class: "log", hidden: "" });
  mount(document.getElementById("launcher"), [
    el("div", { class: "title", text: "Start a run" }),
    el("div", { class: "fields" }, [
      field("Checkout", f.tree), field("Start from", f.init, true), field("Games", f.actors), field("Name", f.name),
      field("More options (optional)", f.extra, true),
    ]),
    el("div", { class: "launch-row" }, [f.start, f.state]),
    f.msg, f.tail,
  ]);
  launch.built = f;
}

function fillLauncher(treeChanged = false) {
  const f = launch.built;
  const o = launch.options;
  const want = f.tree.value || o.default;
  if ([...f.tree.options].map((x) => x.value).join() !== o.trees.map((t) => t.label).join()) {
    mount(f.tree, o.trees.map((t) => el("option", { value: t.label, text: t.label })));
  }
  f.tree.value = o.trees.some((t) => t.label === want) ? want : o.default;
  const t = launchTree();
  if (t) {
    const keep = treeChanged ? null : f.init.value;
    const key = t.checkpoints.map((c) => c.path).join();
    if (f.init.dataset.key !== key) {
      mount(f.init, t.checkpoints.map((c) => el("option", { value: c.path,
        text: `${c.run} · ${c.kind === "RL" ? "RL checkpoint" : "BC policy"} · ${fmtAgo(Date.now() / 1000 - c.updated)}` })));
      f.init.dataset.key = key;
    }
    if (keep && t.checkpoints.some((c) => c.path === keep)) f.init.value = keep;
    if (!f.actors.value || treeChanged) f.actors.value = String(t.fleet ? t.fleet.n : 4);
    if (!f.name.dataset.touched) f.name.value = t.next;
  }
  updateReadiness();
}

async function startRun() {
  const f = launch.built;
  launch.busy = true;
  updateReadiness();
  f.msg.className = "launch-msg";
  f.msg.textContent = "Starting…";
  f.tail.hidden = true;
  const answer = await command("/api/start", { tree: f.tree.value, init: f.init.value, name: f.name.value.trim(),
    actors: parseInt(f.actors.value, 10), extra: f.extra.value });
  launch.busy = false;
  if (answer.ok) {
    f.msg.textContent = `Started ${answer.run} (pid ${answer.pid}). Its output goes to ${answer.log}.`;
    f.name.dataset.touched = "";
  } else {
    f.msg.className = "launch-msg error";
    f.msg.textContent = answer.error || "It did not start.";
    if (answer.tail && answer.tail.length) { f.tail.textContent = answer.tail.join("\n"); f.tail.hidden = false; }
  }
  await Promise.all([pollTrainers(), pollLaunch()]);
}

async function pollLaunch() {
  let options;
  try {
    options = await api("/api/launch");
  } catch (e) { connection(false); return; }
  launch.options = options;
  if (!options.trees.length) {
    launch.built = null;
    mount(document.getElementById("launcher"), [el("div", { class: "title", text: "Start a run" }),
      el("p", { class: "empty-note", text: "No checkout has scripts/train_rl.py and a checkpoint to start from." })]);
    return;
  }
  if (!launch.built) buildLauncher();
  fillLauncher();
}

/* -- runs ------------------------------------------------------------------ */
async function pollRuns() {
  let next;
  try {
    next = await api("/api/runs");
  } catch (e) { connection(false); return; }
  const key = next.runs.map((r) => `${r.name}:${r.updated}:${r.status}:${r.rows}`).join("|");
  if (key !== live.runsKey) {
    live.runsKey = key;
    refreshData(next);  // the page's own renderer; what the reader chose stays chosen
  }
}

/* -- clock ----------------------------------------------------------------- */
document.getElementById("footer").textContent =
  "Live from scripts/supervise.py on this machine — reads runs/*/metrics.jsonl in every checkout, " +
  "watches the games' X servers read-only, and makes no request to anywhere else.";
live.runsKey = DATA.runs.map((r) => `${r.name}:${r.updated}:${r.status}:${r.rows}`).join("|");

const every = (ms, fn) => {
  let timer = null;
  const tick = async () => {
    if (!document.hidden) await fn();
    timer = setTimeout(tick, ms);
  };
  tick();
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { clearTimeout(timer); tick(); }
  });
};
every(2000, pollGames);
every(5000, pollTrainers);
every(5000, pollLaunch);
every(20000, pollRuns);
</script>
