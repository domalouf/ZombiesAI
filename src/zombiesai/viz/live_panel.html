<style>
  /* The site's live additions (viz/live_site.py): is the PC reporting, and what is it training. */
  .live-status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 4px; font-size: 14px; color: var(--chalk-dim); }
  .live-status b { color: var(--chalk); font-weight: 600; }
  .now-runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
  .now-run { display: grid; gap: 8px; align-content: start; }
  .now-run .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .now-run .run { font: 700 17px/1.2 var(--ui); display: inline-flex; align-items: center; gap: 8px; }
  .now-run .run i { display: block; width: 14px; height: 3px; border-radius: 2px; }
  .now-run .kind { font-size: 13px; color: var(--chalk-dim); }
  .now-run .facts { font-size: 13px; color: var(--chalk-dim); }
  .now-run .facts b { color: var(--chalk); font-weight: 600; font-variant-numeric: tabular-nums; }
  .now-run .head { display: flex; align-items: baseline; gap: 10px; }
  .now-run .head .value { font: 600 30px/1 var(--ui); }
  .now-run .head .label { font-size: 13px; color: var(--chalk-dim); }
  /* The machines (with worker PCs, rl/fleet.py): one panel each, its headline numbers in a summary that opens
     onto the machine in full. */
  .machines { display: grid; gap: 14px; }
  .machine-panel { padding: 0; background: transparent; }
  .machine-panel > summary { display: grid; gap: 8px; padding: 14px 16px; cursor: pointer; list-style: none; border-radius: inherit; background: var(--panel); }
  .machine-panel > summary::-webkit-details-marker { display: none; }
  .machine-panel > summary:hover { background: color-mix(in srgb, var(--chalk) 4%, transparent); }
  .machine-panel[open] > summary { border-bottom: 1px solid var(--line); }
  .machine-panel .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .machine-panel .top::before { content: "▸"; color: var(--chalk-faint); transition: transform 0.15s; display: inline-block; }
  .machine-panel[open] .top::before { transform: rotate(90deg); }
  .machine-panel .name { font: 700 16px/1.2 var(--ui); }
  .machine-panel .role { font-size: 12.5px; color: var(--chalk-dim); }
  .machine-panel .top .flag { margin-left: auto; font: 700 12px var(--mono); }
  .machine-panel .meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 6px 18px; }
  .machine-panel .facts { font-size: 13px; color: var(--chalk-dim); }
  .machine-panel .body { padding: 14px 16px 16px; }
  /* An offline machine keeps its last numbers, faded, and says when they are from. */
  .machine-panel.stale .meters, .machine-panel.stale .body { opacity: 0.45; }
  .machine-panel .stale-note { font: 600 12.5px var(--mono); color: var(--warning); }
  @media (prefers-reduced-motion: reduce) { .machine-panel .top::before { transition: none; } }
</style>

<p class="live-status" id="live-status" role="status">Connecting to the PC…</p>

<section aria-labelledby="now-title">
  <h2 id="now-title">Training now</h2>
  <div class="now-runs" id="training-now"><p class="empty-note">Waiting for the PC to report…</p></div>
</section>

<section aria-labelledby="system-title">
  <h2 id="system-title">The machine</h2>
  <div class="machines" id="machines"><p class="empty-note">Waiting for the PC to report…</p></div>
</section>

<h2>Every run</h2>
