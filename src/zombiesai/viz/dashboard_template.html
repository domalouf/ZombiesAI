<title>Training Room</title>
<!--fonts-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&family=Red+Hat+Mono:wght@400;500&family=Sofia+Sans+Condensed:wght@400;600;700&display=swap">
<!--/fonts-->
<style>
  /* Bunker slate. Series colours are the validated dark categorical slots -- the chalk palette is chrome,
     and never carries data. */
  :root {
    --ground: #1a211f;
    --panel: #212a27;
    --floor: #2a3430;
    --line: #37423d;
    --chalk: #e8e4d8;
    --chalk-dim: #9aa39b;
    --chalk-faint: #6f7a73;
    --sanguine: #d0593f;
    --amber: #ddb04d;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --display: "Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
    --ui: "Sofia Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "Red Hat Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--chalk);
    font: 15px/1.45 var(--ui);
    padding-inline: clamp(16px, 3vw, 36px);
    padding-block: 22px 56px;
  }
  main { max-width: 1360px; margin-inline: auto; }
  h2 {
    margin: 30px 0 12px;
    font: 700 13px/1.2 var(--ui);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--chalk-dim);
  }
  .eyebrow { margin: 0; font: 700 12px/1.2 var(--ui); letter-spacing: 0.13em; text-transform: uppercase; color: var(--chalk-dim); }

  /* The bar along the top: the page's name, a way to every section, whether it is live, and the site's links. It
     stays in view on a wide screen; on a phone it scrolls away, where it would take a third of the screen. */
  .topbar {
    margin: -22px calc(-1 * clamp(16px, 3vw, 36px)) 16px;
    padding-inline: clamp(16px, 3vw, 36px);
    background: #1d2522; border-bottom: 1px solid var(--line);
  }
  @media (min-width: 761px) {
    .topbar { position: sticky; top: 0; z-index: 10; }
    section[id], #checks { scroll-margin-top: 76px; }
  }
  .topbar-in { max-width: 1360px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 10px; }
  .brand { margin: 0; font: 800 26px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
  .brand a { color: inherit; text-decoration: none; }
  .sections { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .sections a { padding: 8px 11px; border-radius: 4px; color: var(--chalk-dim); text-decoration: none; font: 600 14px/1 var(--ui); white-space: nowrap; }
  .sections a:hover { color: var(--chalk); }
  .sections a[aria-current="true"] { background: var(--floor); color: var(--chalk); }
  .topbar-end { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
  @media (max-width: 760px) {
    .sections { order: 3; flex-basis: 100%; margin-inline: -11px; }
    .topbar-end { margin-left: 0; }
  }
  .pagebar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; margin-bottom: 14px; }
  .tagline { margin: 6px 0 0; max-width: 72ch; color: var(--chalk-dim); font-size: 14.5px; }
  .about summary { width: fit-content; cursor: pointer; font-size: 13.5px; color: var(--chalk-dim); }
  .about summary:hover { color: var(--chalk); }

  /* A section: a stencil title, a line on what it is for, and on the right whatever it is filtered by. */
  .sec { margin-top: 48px; display: grid; gap: 16px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
  .sec-head h2 { margin: 0; font: 800 30px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; color: var(--chalk); }
  .sec-head .sub { margin: 5px 0 0; font-size: 14px; color: var(--chalk-dim); max-width: 72ch; }
  .sec-head .tools { display: grid; gap: 8px; justify-items: end; }
  .sec-head .tools .filters { margin: 0; justify-content: flex-end; }
  @media (max-width: 760px) { .sec-head .tools { justify-items: start; } .sec-head .tools .filters { justify-content: flex-start; } }
  .sub-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }

  /* The overview: the best game beside what is training, the number the project chases, and anything wrong. */
  .overview { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  .overview.no-film { grid-template-columns: minmax(0, 1fr); }
  .overview .side { display: grid; gap: 16px; align-content: start; }
  .overview.no-film .side { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .overview .side h2 { margin: 0 0 8px; font-size: 12px; }
  .overview .side .now-runs { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 900px) { .overview { grid-template-columns: minmax(0, 1fr); } }
  #overview { display: grid; gap: 16px; }
  .film-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .film-head .hint { font-size: 13px; color: var(--chalk-faint); }
  .film figcaption .more-link { margin-left: auto; color: var(--chalk); font-weight: 600; text-decoration: none; }
  .film figcaption .more-link:hover { text-decoration: underline; }

  .health { display: grid; gap: 10px; align-content: start; }
  .health .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .health .top a { font-size: 13.5px; font-weight: 600; color: var(--chalk); text-decoration: none; }
  .health .top a:hover { text-decoration: underline; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; }
  .count { padding: 4px 9px; border-radius: 3px; font: 700 13.5px/1.2 var(--ui); }
  .count.critical { background: color-mix(in srgb, var(--critical) 18%, transparent); color: #f0716a; }
  .count.warning { background: color-mix(in srgb, var(--warning) 14%, transparent); color: var(--warning); }
  .count.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: #2fbf4a; }
  .count.info { background: var(--floor); color: var(--chalk-dim); }

  /* A verdict on a run: an icon, a word for it on hover, and the sentence. Colour never carries it alone. */
  .checks { display: grid; }
  .check { display: grid; grid-template-columns: 1.9em minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.35; }
  .check .icon { font: 700 13px var(--mono); text-align: center; }
  .check .who { font: 500 12.5px var(--mono); color: var(--chalk-dim); margin-right: 6px; }
  .check.good .icon { color: var(--good); }
  .check.warning .icon { color: var(--warning); }
  .check.serious .icon { color: var(--serious); }
  .check.critical .icon { color: #f0716a; }
  .check.info .icon { color: var(--chalk-dim); }
  .runcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
  .runcard .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .runcard .head .key { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .runcard .head .state { margin-left: auto; font: 500 11.5px var(--mono); color: var(--chalk-dim); }

  /* Under the hood: a strip of the latest values and their trend, opening onto the full charts. */
  .hood > summary { list-style: none; cursor: pointer; display: grid; gap: 12px; }
  .hood > summary::-webkit-details-marker { display: none; }
  .hood .bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .hood .bar .title { font: 700 17px/1.2 var(--ui); }
  .hood .bar .hint { font-size: 13.5px; color: var(--chalk-dim); }
  .hood .bar .toggle { margin-left: auto; font-size: 13.5px; color: var(--chalk-dim); }
  .hood:not([open]) .bar .opened, .hood[open] .bar .closed, .hood[open] .sparks { display: none; }
  .hood[open] > summary { margin-bottom: 14px; }
  .sparks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .spark { padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--ground); display: grid; gap: 2px; }
  .spark .label { font-size: 13px; color: var(--chalk-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spark .value { font: 700 20px/1.2 var(--ui); font-variant-numeric: tabular-nums; }
  .spark svg { display: block; width: 100%; height: 28px; }

  /* Games: one player and a list to pick from, so only one film is ever on screen to play. */
  .theater { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); padding: 0; overflow: hidden; }
  .theater .stage { padding: 14px; border-right: 1px solid var(--line); min-width: 0; }
  @media (max-width: 900px) {
    .theater { grid-template-columns: minmax(0, 1fr); }
    .theater .stage { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  .playlist { display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; padding: 13px 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--chalk-dim); font: 700 14px/1 var(--ui); cursor: pointer; }
  .tabs button:hover { color: var(--chalk); }
  .tabs button[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--chalk); }
  .picks { list-style: none; margin: 0; padding: 8px; display: grid; gap: 4px; max-height: 560px; overflow-y: auto; }
  .pick { width: 100%; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border: 0; border-radius: 4px; background: none; color: var(--chalk); text-align: left; font: inherit; cursor: pointer; }
  .pick:hover { background: color-mix(in srgb, var(--chalk) 5%, transparent); }
  .pick[aria-current="true"] { background: var(--floor); }
  .pick video { display: block; width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 3px; background: #000; pointer-events: none; }
  .pick .name { display: flex; align-items: center; gap: 7px; font-weight: 700; }
  .pick .name .key { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .pick .tag { margin-left: auto; font: 500 11px var(--mono); color: var(--amber); white-space: nowrap; }
  .pick .stats { display: block; font-size: 13px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
  .playlist .foot { margin: auto 0 0; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--chalk-faint); }

  /* Scoring: the rule book beside the gates that check it. */
  .scoring { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .scoring { grid-template-columns: minmax(0, 1fr); } }
  .gates { display: grid; gap: 16px; }
  .chart .title.with-badge { display: flex; align-items: baseline; gap: 0 10px; }
  .badge { margin-left: auto; padding: 3px 8px; border-radius: 3px; font: 700 12.5px/1.2 var(--ui); white-space: nowrap; }
  .badge.critical { background: color-mix(in srgb, var(--critical) 18%, transparent); color: #f0716a; }
  .badge.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: #2fbf4a; }
  .run-checks { display: inline-flex; gap: 8px; font: 700 12.5px var(--mono); }
  .run-checks .critical { color: #f0716a; }
  .run-checks .warning { color: var(--warning); }
  .run-checks .good { color: var(--good); }

  /* A "?" beside a heading or chart title: hover or focus it for what that part means in plain words. Focus too,
     so it works from the keyboard and on a tap. */
  .explain { position: relative; display: inline-block; margin-left: 7px; vertical-align: 1px; }
  .explain button {
    width: 17px; height: 17px; padding: 0;
    font: 700 11px/15px var(--ui); color: var(--chalk-dim); text-align: center;
    background: none; border: 1px solid var(--line); border-radius: 50%; cursor: help;
  }
  .explain button:hover, .explain button:focus-visible { color: var(--chalk); border-color: var(--chalk-dim); }
  .explain .bubble {
    position: absolute; z-index: 6; left: -6px; top: calc(100% + 7px);
    width: max-content; max-width: min(320px, 78vw);
    padding: 8px 10px;
    background: rgba(12, 16, 15, 0.96); border: 1px solid var(--line); border-radius: 3px;
    font: 400 13px/1.4 var(--ui); letter-spacing: normal; text-transform: none; color: var(--chalk);
    display: none;  /* not merely invisible: a hidden bubble past the right edge would still widen the page */
  }
  .explain:hover .bubble, .explain:focus-within .bubble { display: block; }
  /* On a phone the "?" is often near the right edge, where a bubble hung off it would run off the screen: there
     it is a strip along the bottom instead. */
  @media (max-width: 760px) {
    .explain .bubble { position: fixed; left: 16px; right: 16px; bottom: 16px; top: auto; width: auto; max-width: none; z-index: 20; }
  }
  .meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; color: var(--chalk-dim); }
  .meta b { color: var(--chalk); font-weight: 700; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
  }
  .hero { display: grid; align-content: center; gap: 2px; }
  .hero .label { font-size: 13.5px; color: var(--chalk-dim); }
  /* Proportional figures: tabular-nums makes a display-size number look loose. */
  .hero .value { font: 700 clamp(46px, 6vw, 62px)/1 var(--ui); letter-spacing: -0.01em; }
  .hero .sub { font-size: 13.5px; color: var(--chalk-dim); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 1px; background: var(--line);
           border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  /* Two to a row on a phone: an odd last tile takes the whole row rather than leave a hole beside it. */
  @media (max-width: 430px) { .tiles > :last-child:nth-child(odd) { grid-column: 1 / -1; } }
  .tiles .card { border: 0; border-radius: 0; display: grid; align-content: center; gap: 1px; }
  .tiles .label { font-size: 13px; color: var(--chalk-dim); }
  .tiles .value { font: 600 26px/1.1 var(--ui); }
  .tiles .sub { font-size: 12.5px; color: var(--chalk-faint); }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 22px 0 6px; }
  .filters .caption { font-size: 13.5px; color: var(--chalk-dim); margin-right: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: 600 13.5px/1 var(--ui);
    color: var(--chalk);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 11px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--chalk-dim); }
  .chip[aria-pressed="false"] { color: var(--chalk-faint); }
  .chip[aria-pressed="false"] .key { opacity: 0.3; }
  .chip .key { width: 14px; height: 3px; border-radius: 2px; background: currentColor; flex: none; }
  .chip .state { font: 500 11px var(--mono); color: var(--chalk-faint); }
  .chip.seg[aria-pressed="true"] { background: var(--floor); border-color: var(--chalk-dim); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .site-nav { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; }
  .site-nav a { color: var(--chalk-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  .site-nav a:hover { color: var(--chalk); border-color: var(--chalk-dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  figure { margin: 0; }
  .chart { display: grid; gap: 6px; position: relative; }
  .chart .title { font: 700 15px/1.2 var(--ui); }
  .chart .hint { font-size: 13px; color: var(--chalk-dim); margin: 0; }
  .chart svg { display: block; width: 100%; touch-action: pan-y; }
  .chart .axis { font: 500 11px var(--mono); fill: var(--chalk-faint); }
  .chart .rule { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .chart .gate { stroke: var(--critical); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .chart .gate-label { font: 500 11px var(--mono); fill: var(--critical); }
  .chart .end-label { font: 600 12px var(--ui); fill: var(--chalk); }
  .chart .crosshair { stroke: var(--chalk-dim); stroke-width: 1; shape-rendering: crispEdges; }
  .empty-note { font-size: 13px; color: var(--chalk-faint); padding: 18px 0; }
  /* auto-fill: one run's film keeps a column's width rather than stretching across the page */
  .films { grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
  .film { display: grid; gap: 10px; }
  .film video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 3px;
                -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  /* Holding a finger or the mouse on a film plays it at double speed (holdForSpeed): the badge says so. */
  .film .screen { position: relative; }
  .film .fast {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    padding: 3px 10px; border-radius: 3px; background: rgba(0, 0, 0, 0.7); color: #fff;
    font: 700 13px/1.3 var(--ui); pointer-events: none; opacity: 0; transition: opacity 0.12s;
  }
  .film video[data-fast] + .fast { opacity: 1; }
  .film figcaption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 13.5px; color: var(--chalk-dim); }
  .film figcaption .who { display: inline-flex; align-items: center; gap: 7px; font: 700 15px/1.2 var(--ui); color: var(--chalk); }
  .film figcaption .key { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .film figcaption b { color: var(--chalk); font-weight: 600; font-variant-numeric: tabular-nums; }
  .film figcaption .caption { flex-basis: 100%; margin: 0; font-size: 14.5px; color: var(--chalk); }
  .section-note { margin: -4px 0 0; font-size: 13.5px; color: var(--chalk-dim); max-width: 72ch; }

  .tip {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    min-width: 132px;
    padding: 8px 10px;
    background: rgba(12, 16, 15, 0.94);
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 90ms linear;
  }
  .tip .when { color: var(--chalk-dim); font: 500 11px var(--mono); margin-bottom: 4px; }
  .tip .row { display: flex; align-items: baseline; gap: 7px; }
  .tip .row i { display: block; width: 12px; height: 2px; border-radius: 1px; flex: none; }
  /* Values lead, names follow: the reader already knows which line they are on. */
  .tip .row b { font: 600 13.5px var(--ui); font-variant-numeric: tabular-nums; margin-left: auto; }
  .tip .row span { color: var(--chalk-dim); font-size: 12.5px; }

  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: right; padding: 8px 12px; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  thead th { font: 700 11.5px var(--ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--chalk-dim); background: var(--floor); position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody td { font-variant-numeric: tabular-nums; }
  td .key { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 7px; vertical-align: middle; }
  .pill { font: 500 11px var(--mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--chalk-dim); }
  .pill.running { color: var(--good); border-color: var(--good); }
  .pill.done { color: var(--chalk); }
  .pill.stopped { color: var(--warning); border-color: var(--warning); }
  code { font: 500 12.5px var(--mono); color: var(--amber); }
  .blank { display: grid; gap: 12px; max-width: 74ch; }
  .blank pre { margin: 0; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow-x: auto; font: 500 12.5px/1.7 var(--mono); color: var(--chalk); }
  .reward { display: grid; padding: 0; overflow: hidden; }
  .reward .formula { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font: 500 13px/1.6 var(--mono); color: var(--chalk); }
  .reward .scroll { border: 0; border-radius: 0; }
  .reward .section-note { margin: 0; padding: 12px 16px; border-top: 1px solid var(--line); }
  .reward td:nth-child(2) { font-weight: 600; padding-right: 4px; }
  .reward td:nth-child(3) { text-align: left; padding-left: 4px; color: var(--chalk-dim); }
  .reward td.plus { color: var(--good); }
  .reward td.minus { color: var(--sanguine); }
  .reward td:last-child { text-align: left; white-space: normal; color: var(--chalk-dim); }
  .reward tr.off td { color: var(--chalk-faint); }
  footer { margin-top: 34px; font-size: 13px; color: var(--chalk-faint); }
</style>

<header class="topbar">
  <div class="topbar-in">
    <h1 class="brand"><a href="#top">Training Room</a></h1>
    <nav class="sections" id="sections" aria-label="Sections"></nav>
    <div class="topbar-end">
      <div id="status"></div>
      <nav class="site-nav" id="nav" aria-label="Site" hidden></nav>
    </div>
  </div>
</header>
<main id="top">
  <div class="pagebar">
    <p class="meta" id="meta"></p>
    <!-- Folded by default: the numbers are what the reader came for, and the intro would push them below the fold. -->
    <details class="about">
      <summary>About this page</summary>
      <p class="tagline" id="tagline"></p>
    </details>
  </div>
  <!-- The overview, first: the AI playing its best game beside what is training and whether anything is wrong. -->
  <div id="featured"></div>
  <div id="body"></div>
  <footer id="footer"></footer>
</main>

<script>
let DATA = /*__DASHBOARD_DATA__*/null;

const SURFACE = "#212a27";
const STATUS_ICON = { good: "OK", warning: "!", serious: "!!", critical: "X", info: "-" };
const STATUS_WORD = { good: "pass", warning: "watch", serious: "problem", critical: "fail", info: "note" };
const KIND_LABEL = { ppo: "PPO", bc: "behavioural cloning", idm: "inverse dynamics", unknown: "run" };

/* -- formatting ------------------------------------------------------------ */
const fmtInt = (v) => v == null ? "--" : Math.round(v).toLocaleString("en-US");
function fmtCompact(v) {
  if (v == null) return "--";
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(a >= 1e10 ? 0 : 1) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(0) + "K";
  return fmtInt(v);
}
function fmtValue(v) {
  if (v == null || !isFinite(v)) return "--";
  const a = Math.abs(v);
  if (a >= 1e4) return fmtCompact(v);
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  if (a >= 0.1) return v.toFixed(2);
  if (a === 0) return "0";
  return v.toPrecision(2);
}
function fmtDuration(s) {
  if (s == null) return "--";
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return (s / 60).toFixed(0) + "m";
  if (s < 172800) return (s / 3600).toFixed(1) + "h";
  return (s / 86400).toFixed(1) + "d";
}
function fmtAgo(s) { return s < 60 ? "just now" : fmtDuration(s) + " ago"; }

/* -- DOM helpers ----------------------------------------------------------- */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;          // run names come off disk: never innerHTML
    else if (k === "style") node.setAttribute("style", v);
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) node.append(c);
  return node;
}
function mount(node, children) {
  node.replaceChildren(...children.filter(Boolean));
  return node;
}
/* The "?" beside a heading or chart title, and what it says on hover or focus. */
function explain(text) {
  if (!text) return null;
  return el("span", { class: "explain" }, [
    // Inside a <summary> a click would also open or fold its section: the "?" only explains.
    el("button", { type: "button", "aria-label": "What this means: " + text, text: "?", onclick: (e) => e.preventDefault() }),
    el("span", { class: "bubble", "aria-hidden": "true", text }),
  ]);
}

/* What each part of the page means, for a reader who has never trained a model. The hints under each chart
   say what is measured; these say why it matters and what a good one looks like. */
const SECTION_EXPLAIN = {
  learning: "The headline curves. If training is working, these climb over time; flat or falling means the AI " +
    "isn't getting better at the game.",
  reward: "What the AI is paid for while it plays: the only signal it learns from. Every step it adds up these " +
    "terms, read off the game's on-screen HUD, and training pushes it toward whatever earns more of them.",
  gates: "Checks that the AI is winning the game, not gaming the scoring. Its reward comes from several sources; " +
    "if the side ones start to outweigh fighting and surviving, it may have found a loophole instead of learning " +
    "to play. Each red dashed line is a limit the curve should stay under.",
  featured: "The best game the AI has played in any run, as it saw it: the furthest round it reached, with the " +
    "most kills and then the most points breaking a tie. It is replaced whenever the AI does better.",
  films: "A recording of the single best game the AI has played in each run: the highest round it reached, with " +
    "the most kills and then the most points breaking a tie. It is replaced whenever the AI beats it, so this is " +
    "the best it has done so far, as it saw it.",
  saved: "Games kept for good. A run's best game is replaced as soon as the AI beats it, so a game worth " +
    "keeping for itself, whatever comes next, is saved here.",
  hood: "Diagnostics for the training algorithm itself. They don't measure skill, but they warn early when " +
    "something is off: learning stalled, updates too large, or the computer running slowly.",
};
const CHART_EXPLAIN = {
  return_mean: "The total reward the AI earns per game: points for kills, surviving rounds and so on. Going up " +
    "means it is learning to play better.",
  round_reached_mean: "Which zombie round the AI survives to, on average. The goal the whole project is chasing.",
  "val.accuracy.mean_balanced": "How often the copy-a-human model picks the same action a human did, on clips it " +
    "never trained on. Higher is better; balanced so rare actions count as much as common ones.",
  "val.mean_balanced": "How well the model guesses which buttons were pressed between two video frames, on clips " +
    "it never trained on. Higher is better.",
  bonus_share_mean: "The share of the AI's reward that comes from side bonuses: rebuilding barricades, opening " +
    "doors, buying wall weapons and ammo. Kill points and rounds are what playing well earns, so they should make " +
    "up most of it. Should stay under 0.40: above it, the AI is likely farming a bonus rather than fighting.",
  repair_share_mean: "The share of points that come from rebuilding barricades. Repairs are easy points, so an AI " +
    "can learn to farm them instead of fighting. Should stay under 0.25.",
  entropy: "How random the AI's choices are. It starts high (exploring) and should drift down as it settles on " +
    "what works. A crash to zero too early means it stopped trying new things.",
  approx_kl: "KL is short for Kullback-Leibler divergence, a standard measure of how different two probability " +
    "distributions are. Here it compares the AI's choices before and after one update: how much its behaviour " +
    "changed. \"Approx.\" because it is estimated from a sample of moves. Small and steady is healthy; big spikes " +
    "mean updates are too large and learning can become unstable.",
  clipfrac: "How often an update hit PPO's safety limit on change size. A little is normal; a lot means the AI " +
    "is trying to change faster than allowed.",
  explained_variance: "How well the AI predicts the reward it's about to get. 1 is perfect, 0 is no better than " +
    "guessing the average. Should rise toward 1.",
  value_loss: "The error in the AI's reward predictions. Lower is better, though it can rise briefly when the AI " +
    "reaches new situations.",
  length_mean: "How many steps a game lasts before the AI dies or hits the time limit. Longer usually means it " +
    "is surviving better.",
  "loss.policy": "How far the model's chosen actions are from the human's in the training clips. Should fall.",
  "loss.value": "The error in the model's reward predictions during training. Should fall.",
  loss: "The model's overall training error. Should fall, then level off.",
  sps: "How many game steps per second training processes. A speed gauge for the computer, not a measure of " +
    "how well the AI plays.",
};

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, props = {}) {
  const node = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(props)) if (v !== null && v !== undefined) node.setAttribute(k, v);
  return node;
}

/* -- state ----------------------------------------------------------------- */
let runs = DATA.runs;
// Kept apart from DATA: the live page's refreshes (runs.json) carry the runs, not the reward table.
const REWARD = DATA.reward;
// One group per environment (plus one each for BC and the IDM). Runs are sorted newest-first, so the
// group the reader is most likely to want is simply the first one.
const groups = [];
for (const r of runs) if (!groups.some((g) => g.key === r.group)) groups.push({ key: r.group, label: r.group_label });
const state = { group: groups.length ? groups[0].key : null, visible: new Set(runs.map((r) => r.name)),
                fleetRun: null, hiddenMachines: new Set(), hoodOpen: false, gameTab: null, gamePick: null };
let charts = [];
const inGroup = () => runs.filter((r) => r.group === state.group);

/* The live and supervise pages bring panels of their own (body_before). One marked data-slot="<name>" is moved
   into that place in the page each time the page is rebuilt -- moved, not copied, so it keeps what its own script
   has put in it: "status" in the top bar, "now" beside the best game, "machines" in The machines. */
const SLOTTED = {};
for (const node of document.querySelectorAll("[data-slot]")) (SLOTTED[node.dataset.slot] ||= []).push(node);
const slotted = (name) => SLOTTED[name] || [];

/* New numbers from a live server (scripts/supervise.py). What the reader chose stays chosen: the group, and
   which runs are hidden. A run that appears is shown. */
function refreshData(next) {
  const known = new Set(runs.map((r) => r.name));
  DATA = next;
  runs = DATA.runs;
  groups.length = 0;
  for (const r of runs) if (!groups.some((g) => g.key === r.group)) groups.push({ key: r.group, label: r.group_label });
  if (!groups.some((g) => g.key === state.group)) state.group = groups.length ? groups[0].key : null;
  for (const r of runs) if (!known.has(r.name)) state.visible.add(r.name);
  render();
}

/* -- best games -------------------------------------------------------------
   Each run's best game, as its actors filmed it (rl/best_episode.py), where the page knows where the film is
   (the live site: viz/live_site.py links it). The page rebuilds itself whenever new numbers arrive, so each
   <video> is kept and moved into the new page rather than made again: a refresh never stops one playing, and a
   better game's film takes over only once the old one is not being watched. */
const films = new Map();

// One film at a time: starting one pauses whichever else was playing. `play` does not bubble, so catch it on the
// way down.
document.addEventListener("play", (e) => {
  for (const v of films.values()) if (v !== e.target && !v.paused) v.pause();
}, true);

/* Hold on a film to watch it at double speed, and let go to go back: a hold that starts on a paused film plays
   it only while held. The bottom strip is the player's own controls, so a drag along the timeline is left alone,
   and a finger that moves before the hold takes is a scroll, not a hold. */
const HOLD_MS = 300, CONTROLS_PX = 48;
function holdForSpeed(video) {
  let timer = null, held = false, wasPaused = false, from = null;
  const end = () => {
    clearTimeout(timer);
    timer = null;
    if (!held) return;
    held = false;
    video.playbackRate = 1;
    delete video.dataset.fast;
    if (wasPaused) video.pause();
  };
  video.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.clientY > video.getBoundingClientRect().bottom - CONTROLS_PX) return;
    from = [e.clientX, e.clientY];
    timer = setTimeout(() => {
      timer = null;
      held = true;
      wasPaused = video.paused;
      video.playbackRate = 2;
      video.dataset.fast = "";
      if (video.paused) video.play().catch(() => {});
    }, HOLD_MS);
  });
  video.addEventListener("pointermove", (e) => {
    if (timer && from && Math.hypot(e.clientX - from[0], e.clientY - from[1]) > 10) end();
  });
  for (const type of ["pointercancel", "pointerleave"]) video.addEventListener(type, end);
  // The click that follows letting go of a hold would pause or play the film: let it do nothing. It comes in the
  // same task as the pointerup, so the guard goes once that task is over; and should a browser toggle the film
  // anyway, it is put back as the hold left it.
  const swallow = (e) => { e.preventDefault(); e.stopImmediatePropagation(); };
  video.addEventListener("pointerup", () => {
    if (!held) return end();
    const paused = wasPaused;
    video.addEventListener("click", swallow, true);
    end();
    setTimeout(() => {
      video.removeEventListener("click", swallow, true);
      if (video.paused !== paused) paused ? video.pause() : video.play().catch(() => {});
    }, 0);
  });
  // A long press would otherwise open the browser's menu (save video, and so on) on top of the film.
  video.addEventListener("contextmenu", (e) => { if (held || timer) e.preventDefault(); });
  return video;
}

// A film with its "2×" badge. The <video> outlives the page it is in (see above); the frame round it does not.
function screen(video) {
  return el("div", { class: "screen" }, [video, el("span", { class: "fast", text: "2× speed", "aria-hidden": "true" })]);
}

// `key`: which <video> this is. The film at the top of the page is a second player of the best run's film, so it
// has a key of its own rather than taking that run's out of the Games section.
function film(run, key = run.name) {
  const game = run.best_game;
  let video = films.get(key);
  if (!video || (video.dataset.src !== game.video && (video.paused || video.ended))) {
    video = holdForSpeed(el("video", { src: game.video, "data-src": game.video, controls: "", preload: "metadata",
                                       playsinline: "", "aria-label": `${run.name}: its best game, round ${game.round}` }));
    films.set(key, video);
  }
  return video;
}

/* -- saved games ------------------------------------------------------------
   Games kept for good (viz/saved_games.py), their films beside the page. They come with the page, not with the
   live numbers, so a refresh (which replaces DATA) never takes them away. */
const SAVED = (DATA && DATA.saved) || [];

function savedFilm(game) {
  const key = "saved:" + game.name;
  let video = films.get(key);
  if (!video) {
    video = holdForSpeed(el("video", { src: game.video, controls: "", preload: "metadata", playsinline: "",
                                       "aria-label": `${game.title}: a saved game from ${game.run}` }));
    films.set(key, video);
  }
  return video;
}

const statBits = (g) => {
  const bits = [["Round", g.round], ["Points", g.points], ["Kills", g.kills]]
    .filter(([, v]) => v != null).map(([label, v]) => [label, fmtInt(v)]);
  if (g.seconds != null) bits.push(["Lasted", fmtDuration(g.seconds)]);
  return bits.map(([label, value]) => el("span", {}, [document.createTextNode(label + " "), el("b", { text: value })]));
};
const playedAgo = (g) => g.recorded ? el("span", { text: "played " + fmtAgo(Math.max(0, Date.now() / 1000 - g.recorded)) }) : null;
const runKey = (run) => el("span", { class: "key", style: `background:${run.color}` });

// A run's best game, with its numbers under it.
function filmCaption(run, extra) {
  const g = run.best_game;
  return el("figcaption", {}, [
    el("span", { class: "who" }, [runKey(run), el("span", { text: run.name })]),
    ...statBits(g), playedAgo(g), extra,
  ]);
}

function savedCaption(game) {
  return el("figcaption", {}, [
    el("span", { class: "who", text: game.title }),
    ...statBits(game),
    game.run ? el("span", { text: game.run }) : null,
    game.caption ? el("p", { class: "caption", text: game.caption }) : null,
  ]);
}

/* The best of every run's best game, ranked as each run ranks its own: the highest round, then the most kills,
   then the most points. Every run, not the selected environment's: it heads the page, above the selector. */
function bestFilmed() {
  const rank = (g) => [g.round || 0, g.kills || 0, g.points || 0];
  const beats = (a, b) => {
    const x = rank(a.best_game), y = rank(b.best_game);
    const i = x.findIndex((v, j) => v !== y[j]);
    return i >= 0 && x[i] > y[i];
  };
  return runs.filter((r) => r.best_game && r.best_game.video).reduce((a, b) => (!a || beats(b, a) ? b : a), null);
}

function featuredFilm(best) {
  return el("figure", { class: "card film" }, [
    el("div", { class: "film-head" }, [
      el("p", { class: "eyebrow" }, [document.createTextNode("Best game so far"), explain(SECTION_EXPLAIN.featured)]),
      el("span", { class: "hint", text: "Hold the film for 2× speed" }),
    ]),
    screen(film(best, "featured")),
    filmCaption(best, el("a", { class: "more-link", href: "#games", text: "All games →" })),
  ]);
}

/* -- games ------------------------------------------------------------------
   One player and a list beside it: each run's best game in one tab, the saved games in the other. Only the film
   picked is on screen, so there is only ever one to play. */
const thumbs = new Map();
// The list's picture of a film: the film itself a few seconds in, loading no more than it takes to show that frame.
function thumb(src) {
  let video = thumbs.get(src);
  if (!video) {
    video = el("video", { src: src + "#t=6", preload: "metadata", muted: "", playsinline: "", tabindex: "-1",
                          "aria-hidden": "true", disablepictureinpicture: "" });
    thumbs.set(src, video);
  }
  return video;
}

function gameLists() {
  const best = inGroup().filter((r) => r.best_game && r.best_game.video);
  const top = bestFilmed();
  return {
    best: best.map((r) => ({
      key: r.name, video: () => film(r), caption: () => filmCaption(r), src: r.best_game.video,
      name: [runKey(r), el("span", { text: r.name })], tag: r === top ? "best overall" : null,
      stats: [`Round ${fmtInt(r.best_game.round)}`, `${fmtInt(r.best_game.points)} pts`, `${fmtInt(r.best_game.kills)} kills`,
              r.best_game.seconds != null ? fmtDuration(r.best_game.seconds) : null],
    })),
    saved: SAVED.map((g) => ({
      key: "saved:" + g.name, video: () => savedFilm(g), caption: () => savedCaption(g), src: g.video,
      name: [el("span", { text: g.title })], tag: g.run || null,
      stats: [g.round != null ? `Round ${fmtInt(g.round)}` : null, g.points != null ? `${fmtInt(g.points)} pts` : null,
              g.kills != null ? `${fmtInt(g.kills)} kills` : null, g.seconds != null ? fmtDuration(g.seconds) : null],
    })),
  };
}

function gamesSection() {
  const lists = gameLists();
  const tabs = [["best", `Best of each run (${lists.best.length})`], ["saved", `Saved (${lists.saved.length})`]]
    .filter(([k]) => lists[k].length);
  if (!tabs.length) return null;
  if (!tabs.some(([k]) => k === state.gameTab)) state.gameTab = tabs[0][0];
  const items = lists[state.gameTab];
  const pick = items.find((i) => i.key === state.gamePick) || items[0];
  const video = pick.video();
  const node = el("section", { id: "games", class: "sec", "data-nav": "Games" });
  // Only this section changes: the charts keep their place, and a film left on screen keeps playing.
  const redo = () => {
    if (!video.paused) video.pause();  // taken off the page, it would go on playing unseen
    node.replaceWith(gamesSection());
  };
  return mount(node, [
    secHead("Games", SECTION_EXPLAIN.films, "Each run's best game, replaced whenever the AI beats it, and the games kept for good."),
    el("div", { class: "card theater" }, [
      el("figure", { class: "stage film" }, [screen(video), pick.caption()]),
      el("div", { class: "playlist" }, [
        el("div", { class: "tabs", role: "tablist" }, tabs.map(([k, label]) => el("button", {
          type: "button", role: "tab", "aria-selected": String(k === state.gameTab), text: label,
          onclick: () => { if (k !== state.gameTab) { state.gameTab = k; state.gamePick = null; redo(); } },
        }))),
        el("ul", { class: "picks" }, items.map((item) => el("li", {}, el("button", {
          class: "pick", type: "button", "aria-current": String(item === pick),
          onclick: () => { if (item !== pick) { state.gamePick = item.key; redo(); } },
        }, [
          thumb(item.src),
          el("span", {}, [
            el("span", { class: "name" }, [...item.name, item.tag ? el("span", { class: "tag", text: item.tag }) : null]),
            el("span", { class: "stats", text: item.stats.filter(Boolean).join(" · ") }),
          ]),
        ])))),
        el("p", { class: "foot" }, [document.createTextNode("One film plays at a time. Hold a film for 2× speed. "),
          state.gameTab === "saved" ? explain(SECTION_EXPLAIN.saved) : null]),
      ]),
    ]),
  ]);
}

/* -- chart ------------------------------------------------------------------
   One line chart, drawn at the container's real pixel size and redrawn on resize, so the type stays
   at its true size instead of being scaled by a viewBox. */
function Chart(spec) {
  const tip = el("div", { class: "tip", role: "status", "aria-live": "polite" });
  const holder = el("div", { class: "card chart" });
  const head = el("div", {}, [
    el("div", { class: spec.badge ? "title with-badge" : "title" }, [document.createTextNode(spec.title), explain(spec.explain),
      spec.badge ? el("span", { class: "badge " + spec.badge.level, text: spec.badge.text }) : null]),
    spec.hint ? el("p", { class: "hint", text: spec.hint }) : null,
  ]);
  const plot = el("div", { style: "position: relative" }, [tip]);
  holder.append(head, plot);
  const height = spec.big ? 300 : 168;
  const pad = spec.big ? { l: 58, r: 74, t: 12, b: 30 } : { l: 50, r: 16, t: 10, b: 26 };
  let frame = null, hover = null;

  function visibleSeries() {
    return spec.series().filter((s) => s.x.length && (spec.ownFilter || state.visible.has(s.run)));
  }

  function draw() {
    plot.querySelectorAll("svg").forEach((n) => n.remove());
    const series = visibleSeries();
    const width = Math.max(240, plot.clientWidth || holder.clientWidth || 320);
    frame = svg("svg", { width, height, role: "img", "aria-label": spec.title });
    plot.append(frame);
    if (!series.length) {
      frame.append(Object.assign(svg("text", { x: pad.l, y: height / 2, class: "axis" }), { textContent: "no data" }));
      return;
    }
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const s of series) {
      for (const v of s.x) { if (v < x0) x0 = v; if (v > x1) x1 = v; }
      for (const v of s.lo) if (v < y0) y0 = v;
      for (const v of s.hi) if (v > y1) y1 = v;
    }
    if (spec.gate != null) { y0 = Math.min(y0, spec.gate.value); y1 = Math.max(y1, spec.gate.value); }
    if (spec.zero) y0 = Math.min(y0, 0);
    if (x1 === x0) x1 = x0 + 1;
    const padY = (y1 - y0) * 0.08 || Math.abs(y1) * 0.08 || 1;
    y0 -= padY; y1 += padY;
    const px = (v) => pad.l + ((v - x0) / (x1 - x0)) * (width - pad.l - pad.r);
    const py = (v) => height - pad.b - ((v - y0) / (y1 - y0)) * (height - pad.t - pad.b);

    for (const t of ticks(y0, y1, spec.big ? 5 : 4)) {
      frame.append(svg("line", { class: "rule", x1: pad.l, x2: width - pad.r, y1: py(t), y2: py(t) }));
      const label = svg("text", { class: "axis", x: pad.l - 8, y: py(t) + 4, "text-anchor": "end" });
      label.textContent = fmtValue(t);
      frame.append(label);
    }
    for (const t of ticks(x0, x1, spec.big ? 5 : 4)) {
      const label = svg("text", { class: "axis", x: px(t), y: height - 10, "text-anchor": "middle" });
      label.textContent = spec.xFormat(t);
      frame.append(label);
    }
    if (spec.gate != null) {
      frame.append(svg("line", { class: "gate", x1: pad.l, x2: width - pad.r, y1: py(spec.gate.value), y2: py(spec.gate.value) }));
      const label = svg("text", { class: "gate-label", x: width - pad.r - 4, y: py(spec.gate.value) - 5, "text-anchor": "end" });
      label.textContent = spec.gate.label;
      frame.append(label);
    }

    for (const s of series) {
      // The band is the spread the line was averaged out of: a wash, never a block.
      const up = s.x.map((v, i) => `${px(v).toFixed(1)},${py(s.hi[i]).toFixed(1)}`);
      const down = s.x.map((v, i) => `${px(v).toFixed(1)},${py(s.lo[i]).toFixed(1)}`).reverse();
      frame.append(svg("path", { d: `M${up.join("L")}L${down.join("L")}Z`, fill: s.color, "fill-opacity": 0.1, stroke: "none" }));
    }
    for (const s of series) {
      const d = s.x.map((v, i) => `${px(v).toFixed(1)},${py(s.y[i]).toFixed(1)}`).join("L");
      frame.append(svg("path", { d: "M" + d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
    }
    for (const s of series) {
      const i = s.x.length - 1;
      // The surface ring keeps the end dot legible where two runs finish on top of each other.
      frame.append(svg("circle", { cx: px(s.x[i]), cy: py(s.y[i]), r: 4, fill: s.color, stroke: SURFACE, "stroke-width": 2 }));
    }
    if (spec.big && series.length <= 4) {
      const placed = [];
      for (const s of series.slice().sort((a, b) => b.y[b.y.length - 1] - a.y[a.y.length - 1])) {
        const i = s.x.length - 1;
        let y = py(s.y[i]) + 4;
        // Nudge only enough to stop an overlap; past four series the legend carries identity instead.
        while (placed.some((p) => Math.abs(p - y) < 13)) y += 13;
        placed.push(y);
        const label = svg("text", { class: "end-label", x: px(s.x[i]) + 9, y });
        label.textContent = fmtValue(s.y[i]);
        frame.append(label);
      }
    }

    const cross = svg("line", { class: "crosshair", y1: pad.t, y2: height - pad.b, opacity: 0 });
    frame.append(cross);
    const hit = svg("rect", { x: 0, y: 0, width, height, fill: "transparent", tabindex: 0 });
    frame.append(hit);
    const inverse = (cx) => x0 + ((cx - pad.l) / (width - pad.l - pad.r)) * (x1 - x0);

    function show(xValue) {
      hover = xValue;
      const rows = [];
      let snapped = null;
      for (const s of series) {
        let best = 0;
        for (let i = 1; i < s.x.length; i++) if (Math.abs(s.x[i] - xValue) < Math.abs(s.x[best] - xValue)) best = i;
        rows.push({ s, i: best });
        if (snapped === null || Math.abs(s.x[best] - xValue) < Math.abs(snapped - xValue)) snapped = s.x[best];
      }
      cross.setAttribute("x1", px(snapped));
      cross.setAttribute("x2", px(snapped));
      cross.setAttribute("opacity", 1);
      tip.replaceChildren(
        el("div", { class: "when", text: spec.xLabel + " " + spec.xFormat(snapped) }),
        ...rows.map(({ s, i }) =>
          el("div", { class: "row" }, [
            el("i", { style: `background:${s.color}` }),
            el("span", { text: s.name }),
            el("b", { text: fmtValue(s.y[i]) }),
          ])
        )
      );
      tip.style.opacity = 1;
      const cx = px(snapped), tipWidth = tip.offsetWidth;
      const left = cx + 14 + tipWidth > width - 4 ? cx - 14 - tipWidth : cx + 14;
      tip.style.left = Math.max(4, left) + "px";
      tip.style.top = pad.t + "px";
    }
    function hide() { hover = null; cross.setAttribute("opacity", 0); tip.style.opacity = 0; }

    hit.addEventListener("pointermove", (e) => show(inverse(e.offsetX)));
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("blur", hide);
    hit.addEventListener("focus", () => show(hover == null ? x1 : hover));
    hit.addEventListener("keydown", (e) => {
      const stepSize = (x1 - x0) / 40;
      if (e.key === "ArrowRight") { show(Math.min(x1, (hover ?? x1) + stepSize)); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { show(Math.max(x0, (hover ?? x1) - stepSize)); e.preventDefault(); }
      else if (e.key === "Escape") hide();
    });
  }
  charts.push(draw);
  return { node: holder, draw };
}

function ticks(lo, hi, count) {
  const raw = (hi - lo) / count;
  if (!isFinite(raw) || raw <= 0) return [lo];
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) ?? 10 * mag;
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step) out.push(Number(t.toFixed(10)));
  return out;
}

/* -- assembling the page ---------------------------------------------------- */
function seriesFor(key) {
  return () => inGroup().filter((r) => r.series[key]).map((r) => ({ run: r.name, name: r.name, color: r.color, ...r.series[key] }));
}
const stepFormat = (v) => fmtCompact(v);
const epochFormat = (v) => fmtInt(v);

function chartCard(key, opts = {}) {
  const present = inGroup().filter((r) => r.series[key]);
  if (!present.length) return null;
  const meta = DATA.series_meta[key] || { label: key, hint: "" };
  const byEpoch = present.every((r) => r.x_key === "epoch");
  return Chart({
    title: opts.title || meta.label,
    hint: opts.hint ?? meta.hint,
    explain: CHART_EXPLAIN[key],
    series: seriesFor(key),
    big: !!opts.big,
    zero: !!opts.zero,
    gate: opts.gate,
    badge: opts.badge,
    xLabel: byEpoch ? "epoch" : "step",
    xFormat: byEpoch ? epochFormat : stepFormat,
  }).node;
}

/* -- each machine ------------------------------------------------------------
   A run trained on several PCs (rl/fleet.py) logs every machine's share of each update. One run at a time, one
   line per machine, coloured by the machine's number: one PC feeding the batch worse data stands out here
   instead of being averaged into the curves above. */
function machineLabel(run, m) {
  const name = run.machines.names[m];
  if (m === "0") return name || "Training PC";
  return name ? `${name} (machine ${m})` : `Machine ${m}`;
}

function machineCard(run, key, opts = {}) {
  const s = run.machines.series[key];
  if (!s) return null;
  return Chart({
    title: s.label, hint: s.hint, zero: true, gate: opts.gate, ownFilter: true, xLabel: "step", xFormat: stepFormat,
    series: () => run.machines.ids.filter((m) => s.by[m] && !state.hiddenMachines.has(m))
      .map((m) => ({ run: run.name, name: machineLabel(run, m), color: run.machines.colors[m], ...s.by[m] })),
  }).node;
}

function fleetCharts() {
  const fleetRuns = inGroup().filter((r) => r.machines);
  if (!fleetRuns.length) return null;
  if (!fleetRuns.some((r) => r.name === state.fleetRun)) state.fleetRun = fleetRuns[0].name;  // newest first
  const run = fleetRuns.find((r) => r.name === state.fleetRun);
  const picker = fleetRuns.length > 1 ? el("div", { class: "filters" }, [
    el("span", { class: "caption", text: "Run:" }),
    ...fleetRuns.map((r) => el("button", {
      class: "chip seg", type: "button", "aria-pressed": String(r.name === run.name),
      onclick: () => { state.fleetRun = r.name; renderScoped(); },
    }, [el("span", { class: "key", style: `background:${r.color}` }), el("span", { text: r.name })])),
  ]) : null;
  // The legend and the filter at once, as the run chips are: identity is never colour alone.
  const legend = el("div", { class: "filters" }, [
    el("span", { class: "caption", text: "Machines:" }),
    ...run.machines.ids.map((m) => {
      const chip = el("button", { class: "chip", type: "button", "aria-pressed": String(!state.hiddenMachines.has(m)) }, [
        el("span", { class: "key", style: `background:${run.machines.colors[m]}` }),
        el("span", { text: machineLabel(run, m) }),
      ]);
      chip.addEventListener("click", () => {
        if (state.hiddenMachines.has(m)) state.hiddenMachines.delete(m); else state.hiddenMachines.add(m);
        chip.setAttribute("aria-pressed", String(!state.hiddenMachines.has(m)));
        for (const draw of charts) draw();
      });
      return chip;
    }),
  ]);
  const warn = run.machines.late_warn_pct;
  const cards = [
    machineCard(run, "bad_step_pct", { gate: { value: warn, label: `warns at ${warn}%` } }),
    machineCard(run, "round_reached_mean"),
    machineCard(run, "share_pct"),
    machineCard(run, "stale_pct"),
  ].filter(Boolean);
  return el("div", { style: "display:grid;gap:10px" }, [
    el("p", { class: "eyebrow", text: "Each machine's share of training" }),
    el("p", { class: "section-note", style: "margin:0", text: `${run.name} trained on games from ${run.machines.ids.length} ` +
      `machine${run.machines.ids.length === 1 ? "" : "s"}. Each line is one machine's own share of every update.` }),
    picker, legend, el("div", { class: "grid" }, cards),
  ]);
}

// A section's head: its title and "?", a line on what it is for, and on the right what it is filtered by.
function secHead(title, about, sub, tools = []) {
  const kept = tools.filter(Boolean);
  return el("div", { class: "sec-head" }, [
    el("div", {}, [el("h2", {}, [document.createTextNode(title), explain(about)]), sub ? el("p", { class: "sub", text: sub }) : null]),
    kept.length ? el("div", { class: "tools" }, kept) : null,
  ]);
}

/* The reward function, as reward.describe() wrote it into the page: what each event pays, from the code itself. */
function rewardCard() {
  if (!REWARD || !inGroup().some((r) => r.kind === "ppo")) return null;
  const signed = (v) => (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(1);
  const rows = REWARD.terms.map((t) => el("tr", { class: t.detected ? null : "off" }, [
    el("td", { text: t.event }),
    el("td", { class: t.detected ? (t.reward > 0 ? "plus" : "minus") : null, text: signed(t.reward) }),
    el("td", { text: t.per }),
    el("td", { text: [t.cap, t.detected ? null : "not read from the screen yet, so always 0"].filter(Boolean).join("; ") || "" }),
  ]));
  const [lo, hi] = REWARD.clip;
  return el("div", { class: "card reward" }, [
    el("p", { class: "formula", text: `reward per step = clip(sum of the terms below, ${signed(lo)}, ${signed(hi)})` }),
    el("div", { class: "scroll" }, el("table", {}, [
      el("thead", {}, el("tr", {}, ["Event", "Reward", "", "Limit"].map((h) => el("th", { text: h })))),
      el("tbody", {}, rows),
    ])),
    el("p", { class: "section-note", text: `Rewards are in units of ${fmtInt(REWARD.points_scale)} game points. ` +
      "Repairs pay a fifth of their points and doors and wall weapons pay once each, so the AI can't farm them; " +
      "the gates beside this watch for it anyway." }),
  ]);
}

// How many of the runs shown are past a gate now, for the badge on its chart.
function gateBadge(key, limit) {
  const over = inGroup().filter((r) => r.series[key] && r.series[key].last > limit).length;
  return over ? { level: "critical", text: `${over} run${over === 1 ? "" : "s"} over` } : { level: "good", text: "all under" };
}

// The rule book and the gates that check it, side by side: a gate means something only next to what it guards.
function scoringSection() {
  const g = DATA.gates;
  const gates = [
    chartCard("bonus_share_mean", { gate: { value: g.bonus_share.limit, label: `gate ${g.bonus_share.limit.toFixed(2)}` }, zero: true,
                                    badge: gateBadge("bonus_share_mean", g.bonus_share.limit) }),
    chartCard("repair_share_mean", { gate: { value: g.repair_share.limit, label: `gate ${g.repair_share.limit.toFixed(2)}` }, zero: true,
                                     badge: gateBadge("repair_share_mean", g.repair_share.limit) }),
  ].filter(Boolean);
  const rules = rewardCard();
  if (!rules && !gates.length) return null;
  return el("section", { id: "scoring", class: "sec", "data-nav": "Scoring" }, [
    secHead("How it\u2019s scored", SECTION_EXPLAIN.reward,
            "What the AI is paid for, and the gates that check it is winning the game rather than gaming the score."),
    el("div", { class: rules && gates.length ? "scoring" : "" }, [
      rules,
      gates.length ? el("div", { class: "gates" }, [
        el("p", { class: "eyebrow" }, [document.createTextNode("Reward hacking gates (PLAN.md, M7 T1)"), explain(SECTION_EXPLAIN.gates)]),
        ...gates,
      ]) : null,
    ]),
  ]);
}

function heroCard() {
  // One hero per view: the number this project is actually chasing, if any run has reached for it.
  const rounds = runs.filter((r) => r.series.round_reached_mean);
  if (rounds.length) {
    const best = rounds.reduce((a, b) => (a.series.round_reached_mean.best >= b.series.round_reached_mean.best ? a : b));
    const s = best.series.round_reached_mean;
    // The furthest one game got, which only runs that log their games one by one can say (episodes.jsonl).
    const games = runs.filter((r) => r.stats.best_round != null);
    const far = games.length ? games.reduce((a, b) => (a.stats.best_round >= b.stats.best_round ? a : b)) : null;
    return el("div", { class: "card hero" }, [
      el("div", { class: "label", text: "Highest average round, over 100 games in a row" }),
      el("div", { class: "value", text: s.best.toFixed(2) }),
      el("div", { class: "sub", text: `${best.name} — its last 100 games average round ${s.last.toFixed(2)}` }),
      far ? el("div", { class: "sub", text: `Furthest single game: round ${far.stats.best_round} (${far.name})` }) : null,
    ]);
  }
  const withReturn = runs.filter((r) => r.series.return_mean);
  if (withReturn.length) {
    const best = withReturn.reduce((a, b) => (a.series.return_mean.best >= b.series.return_mean.best ? a : b));
    return el("div", { class: "card hero" }, [
      el("div", { class: "label", text: "Best mean return" }),
      el("div", { class: "value", text: fmtValue(best.series.return_mean.best) }),
      el("div", { class: "sub", text: `${best.name} — now ${fmtValue(best.series.return_mean.last)}` }),
    ]);
  }
  const acc = runs.filter((r) => r.stats["val.accuracy.mean_balanced"] || r.stats["val.mean_balanced"]);
  if (acc.length) {
    const pick = (r) => (r.stats["val.accuracy.mean_balanced"] || r.stats["val.mean_balanced"]).best;
    const best = acc.reduce((a, b) => (pick(a) >= pick(b) ? a : b));
    return el("div", { class: "card hero" }, [
      el("div", { class: "label", text: "Best validation balanced accuracy" }),
      el("div", { class: "value", text: pick(best).toFixed(3) }),
      el("div", { class: "sub", text: best.name }),
    ]);
  }
  return el("div", { class: "card hero" }, [
    el("div", { class: "label", text: "Runs found" }),
    el("div", { class: "value", text: String(runs.length) }),
  ]);
}

/* Not plain tile(): the live and supervise pages append system_view.html, whose own tile() would replace this
   one, since every page script shares one global scope. */
function runTile(label, value, sub) {
  return el("div", { class: "card" }, [
    el("div", { class: "label", text: label }),
    el("div", { class: "value", text: value }),
    sub ? el("div", { class: "sub", text: sub }) : null,
  ]);
}

function tiles() {
  const sum = (f) => runs.reduce((a, r) => a + (f(r) || 0), 0);
  const live = runs.filter((r) => r.status === "running");
  const fastest = runs.reduce((a, r) => Math.max(a, r.stats.sps || 0), 0);
  return el("div", { class: "tiles" }, [
    runTile("Runs", String(runs.length), `${live.length} running, ${runs.filter((r) => r.status === "done").length} finished`),
    runTile("Steps trained", fmtCompact(sum((r) => r.stats.steps)), "environment steps across every run"),
    runTile("Episodes played", fmtCompact(sum((r) => r.stats.episodes)), "games finished, real or rehearsal"),
    runTile("Training time", fmtDuration(sum((r) => r.elapsed_s)), "wall clock, summed"),
    fastest ? runTile("Fastest", fmtCompact(fastest) + "/s", "steps per second") : null,
  ]);
}

/* -- what the numbers say ----------------------------------------------------
   Each run's verdicts (dashboard._notes): all of them at the top of the page as counts and the failures, and run by
   run under the curves they are about. */
const LEVEL_ORDER = { critical: 0, serious: 1, warning: 2, good: 3, info: 4 };
const byLevel = (a, b) => LEVEL_ORDER[a.note.level] - LEVEL_ORDER[b.note.level];

function checkRow({ run, note }, who = true) {
  // Status colour never carries meaning alone: icon, word and text all say it.
  return el("div", { class: "check " + note.level }, [
    el("span", { class: "icon", text: STATUS_ICON[note.level], title: STATUS_WORD[note.level] }),
    el("span", {}, [who ? el("span", { class: "who", text: run.name }) : null, document.createTextNode(note.text)]),
  ]);
}

function healthCard() {
  const rows = runs.flatMap((r) => r.notes.map((note) => ({ run: r, note }))).sort(byLevel);
  if (!rows.length) return null;
  const count = (...levels) => rows.filter((x) => levels.includes(x.note.level)).length;
  const counts = [
    ["critical", count("critical"), "failing"], ["warning", count("serious", "warning"), "to watch"],
    ["good", count("good"), "passing"], ["info", count("info"), "notes"],
  ].filter(([, n]) => n);
  const worst = rows.filter((x) => x.note.level === "critical" || x.note.level === "serious").slice(0, 3);
  return el("div", { class: "card health" }, [
    el("div", { class: "top" }, [el("p", { class: "eyebrow", text: "Health checks" }),
                                 el("a", { href: "#checks", text: `All ${rows.length} →` })]),
    el("div", { class: "counts" }, counts.map(([level, n, word]) => el("span", { class: "count " + level, text: `${n} ${word}` }))),
    worst.length ? el("div", { class: "checks" }, worst.map((x) => checkRow(x))) : null,
  ]);
}

function runChecks() {
  const shown = inGroup().filter((r) => r.notes.length);
  if (!shown.length) return null;
  return el("div", { id: "checks", style: "display:grid;gap:10px" }, [
    el("p", { class: "eyebrow", text: "What the numbers say, run by run" }),
    el("div", { class: "runcards" }, shown.map((r) => el("div", { class: "card runcard" }, [
      el("div", { class: "head" }, [runKey(r), el("b", { text: r.name }), el("span", { class: "state",
        text: [r.status, r.progress != null ? `${Math.round(100 * r.progress)}%` : null].filter(Boolean).join(" · ") })]),
      el("div", { class: "checks" }, r.notes.map((note) => ({ run: r, note })).sort(byLevel).map((x) => checkRow(x, false))),
    ]))),
  ]);
}

/* -- under the hood ---------------------------------------------------------- */
const HOOD = [
  ["entropy"], ["approx_kl"], ["clipfrac"], ["explained_variance"], ["value_loss"], ["length_mean"],
  ["loss.policy"], ["loss.value"], ["loss"],
  ["sps", { title: "Steps per second", hint: "how fast data arrives — not how well it learns" }],
];

// One measure's latest value and the shape of its curve, for the newest run that has it.
function sparkTile(label, s, color) {
  const lo = Math.min(...s.y), hi = Math.max(...s.y), x0 = s.x[0], x1 = s.x[s.x.length - 1];
  const pts = s.x.map((x, i) => `${(100 * (x - x0) / ((x1 - x0) || 1)).toFixed(1)},${(26 - 24 * (s.y[i] - lo) / ((hi - lo) || 1)).toFixed(1)}`);
  const line = svg("svg", { viewBox: "0 0 100 28", preserveAspectRatio: "none", "aria-hidden": "true" });
  line.append(svg("polyline", { points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }));
  return el("div", { class: "spark" }, [el("span", { class: "label", text: label }), el("span", { class: "value", text: fmtValue(s.last) }), line]);
}

function hood() {
  const cards = HOOD.map(([key, opts]) => chartCard(key, opts)).filter(Boolean);
  if (!cards.length) return null;
  const lead = inGroup().find((r) => HOOD.some(([key]) => r.series[key]));
  const sparks = HOOD.filter(([key]) => lead.series[key] && lead.series[key].y.length)
    .map(([key, opts]) => sparkTile((opts && opts.title) || (DATA.series_meta[key] || { label: key }).label, lead.series[key], lead.color));
  const box = el("details", { class: "card hood" }, [
    el("summary", {}, [
      el("div", { class: "bar" }, [
        el("span", { class: "title" }, [document.createTextNode("Under the hood"), explain(SECTION_EXPLAIN.hood)]),
        el("span", { class: "hint", text: `diagnostics for the algorithm, not skill · the latest for ${lead.name}` }),
        el("span", { class: "toggle" }, [el("span", { class: "closed", text: `Show all ${cards.length} charts ▾` }),
                                         el("span", { class: "opened", text: "Hide the charts ▴" })]),
      ]),
      el("div", { class: "sparks" }, sparks),
    ]),
    el("div", { class: "grid" }, cards),
  ]);
  box.open = state.hoodOpen;
  // Drawn while folded, the charts had no width to draw at: draw them again now there is one.
  box.addEventListener("toggle", () => { state.hoodOpen = box.open; if (box.open) for (const draw of charts) draw(); });
  return box;
}

function groupRow() {
  if (groups.length < 2) return null;
  const buttons = groups.map((g) => {
    const count = runs.filter((r) => r.group === g.key).length;
    const button = el("button", { class: "chip seg", type: "button", "data-group": g.key, "aria-pressed": String(g.key === state.group) }, [
      el("span", { text: g.label }),
      el("span", { class: "state", text: String(count) }),
    ]);
    button.addEventListener("click", () => { state.group = g.key; renderScoped(); });
    return button;
  });
  return el("div", { class: "filters" }, [el("span", { class: "caption", text: "Environment:" }), ...buttons]);
}

function filterRow() {
  // These chips are the legend as well as the filter: identity is never left to colour alone.
  const chips = inGroup().map((r) => {
    const chip = el("button", { class: "chip", type: "button", "aria-pressed": "true" }, [
      el("span", { class: "key", style: `background:${r.color}` }),
      el("span", { text: r.name }),
      el("span", { class: "state", text: r.status }),
    ]);
    chip.addEventListener("click", () => {
      const on = chip.getAttribute("aria-pressed") === "true";
      chip.setAttribute("aria-pressed", String(!on));
      if (on) state.visible.delete(r.name); else state.visible.add(r.name);
      for (const draw of charts) draw();
    });
    return chip;
  });
  return el("div", { class: "filters" }, [el("span", { class: "caption", text: "Runs:" }), ...chips]);
}

function table() {
  const cols = [
    ["Run", (r) => null],
    ["Kind", (r) => KIND_LABEL[r.kind] || r.kind],
    ["Status", (r) => null],
    ["Checks", (r) => null],
    ["Progress", (r) => r.progress_text],
    ["Return", (r) => (r.series.return_mean ? fmtValue(r.series.return_mean.last) : "--")],
    ["Best return", (r) => (r.series.return_mean ? fmtValue(r.series.return_mean.best) : "--")],
    ["Avg round (last 100)", (r) => (r.series.round_reached_mean ? r.series.round_reached_mean.last.toFixed(2) : "--")],
    ["Best round", (r) => (r.stats.best_round != null ? String(r.stats.best_round) : "--")],
    ["Val bal. acc.", (r) => {
      const s = r.stats["val.accuracy.mean_balanced"] || r.stats["val.mean_balanced"];
      return s ? s.last.toFixed(3) : "--";
    }],
    ["Episodes", (r) => fmtCompact(r.stats.episodes)],
    ["Steps", (r) => fmtCompact(r.stats.steps)],
    ["Steps/s", (r) => fmtCompact(r.stats.sps)],
    ["Elapsed", (r) => fmtDuration(r.elapsed_s)],
    ["Left", (r) => (r.eta_s ? fmtDuration(r.eta_s) : "--")],
    ["Updated", (r) => fmtAgo(r.age_s)],
  ];
  // A run's verdicts, counted: failing, to watch, passing.
  const tally = (r) => [["critical", ["critical"]], ["warning", ["serious", "warning"]], ["good", ["good"]]]
    .map(([cls, levels]) => [cls, r.notes.filter((n) => levels.includes(n.level)).length]).filter(([, n]) => n)
    .map(([cls, n]) => el("span", { class: cls, title: `${n} ${{ critical: "failing", warning: "to watch", good: "passing" }[cls]}`,
                                    text: `${STATUS_ICON[cls]}${n}` }));
  return el("section", { id: "runs", class: "sec", "data-nav": "Runs" }, [
    secHead("Every run", null, groups.length > 1 ? "All runs, including those outside the environment selected above."
                                                 : "All runs, every number."),
    el("div", { class: "scroll" }, [
      el("table", {}, [
        el("thead", {}, [el("tr", {}, cols.map(([name]) => el("th", { text: name, scope: "col" })))]),
        el("tbody", {}, runs.map((r) =>
          el("tr", {}, cols.map(([name, get]) => {
            if (name === "Run") {
              return el("td", {}, [el("span", { class: "key", style: `background:${r.color}` }), el("span", { text: r.name })]);
            }
            if (name === "Status") return el("td", {}, [el("span", { class: "pill " + r.status, text: r.status })]);
            if (name === "Checks") return el("td", {}, [el("span", { class: "run-checks" }, tally(r))]);
            return el("td", { text: get(r) ?? "--" });
          }))
        )),
      ]),
    ]),
  ]);
}

function blankSlate() {
  // The site (viz/live_site.py) after a batch of runs was retired: say so, not how to start a run on this PC.
  if (DATA.live) return el("div", { class: "blank" }, [el("p", { text:
    "No runs on the current code yet. Earlier runs were trained on code that misread the game, so they were " +
    "taken down; the next run will show up here as soon as it starts training." })]);
  return el("div", { class: "blank" }, [
    el("p", { text: `No run in ${DATA.root} has written a metrics.jsonl yet. Start one and this page fills in:` }),
    el("pre", { text: [
      "# behavioural cloning from your recordings",
      "uv run python scripts/train_bc.py data/demos --out runs/bc1",
      "",
      "# then PPO on the real game, four instances",
      "uv run python scripts/train_rl.py runs/bc1/bc.pt --actors 4",
      "",
      "# rebuild this page every 30s while it trains",
      "uv run python scripts/dashboard.py --watch 30",
    ].join("\n") }),
  ]);
}

/* The top of the page: the best game any run has played beside what is training now, the number the project
   chases and whether anything is wrong, then the totals. */
function overview() {
  const best = bestFilmed();
  const now = slotted("now");
  if (!runs.length && !now.length) return null;
  return el("section", { id: "overview", "data-nav": "Overview" }, [
    el("div", { class: "overview" + (best ? "" : " no-film") }, [
      best ? featuredFilm(best) : null,
      el("div", { class: "side" }, [...now, runs.length ? heroCard() : null, healthCard()]),
    ]),
    runs.length ? tiles() : null,
  ]);
}

// The PCs, as the live page reports them (its "machines" slot), and each one's share of a run trained on several.
function machinesSection() {
  return el("section", { id: "the-machines", class: "sec", "data-nav": "Machines" }, [...slotted("machines"), el("div", { id: "fleet" })]);
}

/* The section links in the top bar: the sections the page has now, the one being read marked. */
const navSections = () => [...document.querySelectorAll("main [data-nav]")].filter((s) => !s.hidden);
function sectionNav() {
  mount(document.getElementById("sections"), navSections().map((s) =>
    el("a", { href: "#" + s.id, text: s.dataset.nav, "data-for": s.id })));
  markSection();
}
function markSection() {
  const all = navSections();
  let current = all.length ? all[0].id : null;
  for (const s of all) if (s.getBoundingClientRect().top <= 110) current = s.id;
  for (const a of document.querySelectorAll("#sections a")) a.setAttribute("aria-current", String(a.dataset.for === current));
}

function render() {
  const live = runs.filter((r) => r.status === "running");
  if (DATA.links && DATA.links.length) {
    const nav = document.getElementById("nav");
    nav.hidden = false;
    mount(nav, DATA.links.map(([label, href]) => el("a", { href, text: label })));
  }
  document.getElementById("tagline").textContent = DATA.intro || (runs.length
    ? "Every training run under " + DATA.root + ", read from the metrics each trainer writes as it goes. " +
      "Lines are bucket means; the wash behind each one is the spread inside the bucket, so nothing is smoothed away."
    : "Nothing to show yet.");
  mount(document.getElementById("meta"), [
    el("span", {}, [document.createTextNode(DATA.live ? "Runs read " : "Built "), el("b", { text: DATA.generated })]),
    el("span", {}, [el("b", { text: String(runs.length) }), document.createTextNode(" runs")]),
    live.length ? el("span", {}, [el("b", { text: String(live.length) }),
      document.createTextNode(DATA.intro && !DATA.live ? " running when this was built" : " running now")]) : null,
  ]);

  mount(document.getElementById("featured"), [overview()]);
  const body = document.getElementById("body");
  if (!runs.length) {
    const machines = machinesSection();
    machines.hidden = !slotted("machines").length;
    mount(body, [blankSlate(), machines]);
    sectionNav();
    return;
  }
  mount(body, [el("div", { id: "scoped" }), machinesSection(), table()]);
  renderScoped();
}

/* Everything the environment filter scopes. Which charts exist depends on the selection, so this
   rebuilds rather than redraws. */
function renderScoped() {
  charts = [];
  const curves = [
    chartCard("return_mean", { big: true, title: "Return", hint: "mean over the trailing 100 episodes — the one curve that answers the question" }),
    chartCard("round_reached_mean", { big: true, title: "Average round reached", hint: "how far into Nacht der Untoten it survives, mean of the last 100 games" }),
    chartCard("val.accuracy.mean_balanced", { big: true, hint: "mean per-class recall across the action heads, on held-out clips" }),
    chartCard("val.mean_balanced", { big: true, hint: "how well it recovers the actions taken between two frames, on held-out clips" }),
  ].filter(Boolean);
  const learning = el("section", { id: "learning", class: "sec", "data-nav": "Learning" }, [
    secHead("Is it learning?", SECTION_EXPLAIN.learning, "The headline curves: if training is working, they climb.",
            [groupRow(), filterRow()]),
    curves.length ? el("div", { class: "grid" }, curves) : null,
    runChecks(),
    hood(),
  ]);
  mount(document.getElementById("scoped"), [learning, gamesSection(), scoringSection()]);
  const fleet = document.getElementById("fleet");
  mount(fleet, [fleetCharts()]);
  fleet.closest("section").hidden = !slotted("machines").length && !fleet.childNodes.length;
  for (const btn of document.querySelectorAll(".seg[data-group]")) {
    btn.setAttribute("aria-pressed", String(btn.dataset.group === state.group));
  }
  sectionNav();
  for (const draw of charts) draw();
}

document.getElementById("footer").textContent = DATA.intro
  ? "A snapshot, not a live view: these are the numbers as they stood when the page was built."
  : "ZombiesAI — reads runs/*/metrics.jsonl, makes no request to anywhere. Rebuild with scripts/dashboard.py.";
mount(document.getElementById("status"), slotted("status"));
render();
let resizeTimer = null;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { for (const draw of charts) draw(); }, 120);
});
let navFrame = null;
addEventListener("scroll", () => {
  if (navFrame == null) navFrame = requestAnimationFrame(() => { navFrame = null; markSection(); });
}, { passive: true });
</script>
