[project]
name = "zombiesai"
version = "0.1.0"
description = "An agent for CoD: World at War's Nacht der Untoten that learns from the real game's pixels and audio on Linux: behavioural cloning, then PPO across many game instances and PCs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.1",
    "scipy>=1.13",
    "torch>=2.8",
]

[dependency-groups]
dev = ["pytest>=8"]
# Screen capture (X11, MIT-SHM) and raw input (evdev) are ctypes and file reads: no package. Video ingest
# needs the ffmpeg binary, not a Python package.

[tool.uv]
default-groups = ["dev"]

# The RTX 5070 is Blackwell (sm_120) and needs a CUDA 12.8+ build; the default PyPI wheel can't see it. The
# gaming PCs run Linux, so Linux gets the CUDA index; a CPU-only Linux box still resolves -- it just downloads
# the CUDA libraries and never uses them. Anything else (a laptop reading the dashboard) gets the CPU build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zombiesai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-episode statistical tests"]
