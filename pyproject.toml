[project]
name = "zombiesai"
version = "0.1.0"
description = "RL agent for CoD: World at War's Nacht der Untoten, from screen capture and synthetic input only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zombiesai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-episode statistical tests"]
